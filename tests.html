<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test file</title>
</head>

<body>

    <script type="module">
        import {
            isValidDuration,
            isValidTitle
        } from "./scripts/validators.js";

        console.assert(
            isValidDuration("90") === true,
            "90 should be a valid duration"
        );


        console.assert(
            isValidDuration("100.943") === false,
            "Three decimal digits should be rejected"
        );

        console.assert(
            isValidDuration("012.92") === false,
            "Leading zeros should be rejected"
        );

        console.assert(
            isValidDuration("100.94") === true,
            "Two decimal digits should be accepted"
        );

        console.assert(
            isValidDuration("90abc") === false,
            "90abc should be rejected"
        );



        console.assert(
            isValidTitle("Campus Fair") === true,
            "A normal title should pass"
        );

        console.assert(
            isValidTitle(" Campus Fair") === false,
            "A leading space should be rejected"
        );

        console.assert(
            isValidTitle("Campus Fair ") === false,
            "A trailing space should be rejected"
        );

        console.assert(
            isValidTitle("") === false,
            "An empty title should be rejected"
        );
        console.log("Validation tests finished.");
    </script>

</body>

</html>
