<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test file</title>
</head>

<body>

    <script type="module">
        import { isValidDuration } from "./scripts/validators.js";

        console.assert(
            isValidDuration("90") === true,
            "90 should be a valid duration"
        );

        console.log("Duration test finished.");

        console.assert(
            isValidDuration("100.943") === false,
            "Three decimal digits should be rejected"
        );

        console.assert(
            isValidDuration("012.92") === false,
            "Leading zeros should be rejected"
        );

        console.assert(
            isValidDuration("100.94") === true,
            "Two decimal digits should be accepted"
        );

    </script>

</body>

</html>
